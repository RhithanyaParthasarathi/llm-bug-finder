# .github/workflows/llm-bugfinder.yml
#
# LLM-Diff-BugFinder — Automated PR Behavioral Regression Check
# =============================================================
# Drop this file into ANY Python repository.
# It will automatically run on every Pull Request and post a comment
# listing any behavioral regressions the Z3 solver finds.
#
# Setup (one-time):
#   1. Copy this file to .github/workflows/llm-bugfinder.yml in your repo
#   2. Copy the project/src/ and project/scripts/pr_scanner.py to your repo
#      (or install from PyPI once published)
#   3. The GITHUB_TOKEN is automatically available — no secrets needed.

name: LLM-Diff-BugFinder — Behavioral Regression Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**.py"          # Only trigger when Python files changed

permissions:
  contents: read
  pull-requests: write  # Needed to post PR comments

jobs:
  behavioral-regression-check:
    name: Z3 Solver — Behavioral Regression Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Checkout the full repo (with history for git diff) ────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Full history needed for git diff

      # ── 2. Set up Python ─────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 3. Install LLM-Diff-BugFinder dependencies ───────────────────────
      - name: Install dependencies
        run: |
          pip install --quiet crosshair-tool>=0.0.110 z3-solver>=5.1.0

      # ── 4. Get the PR diff ───────────────────────────────────────────────
      - name: Get PR diff
        id: get_diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD -- "*.py" > /tmp/pr.diff
          echo "lines=$(wc -l < /tmp/pr.diff)" >> $GITHUB_OUTPUT

      # ── 5. Run the behavioral regression scanner ─────────────────────────
      - name: Run LLM-Diff-BugFinder
        id: scanner
        run: |
          python project/scripts/pr_scanner.py \
            --diff /tmp/pr.diff \
            --repo . \
            --timeout 25 \
            --output /tmp/pr_comment.md
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true   # Don't fail the step itself; we handle it below

      # ── 6. Post the result as a PR comment ───────────────────────────────
      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let body;
            try {
              body = fs.readFileSync('/tmp/pr_comment.md', 'utf8');
            } catch(e) {
              body = "✅ **LLM-Diff-BugFinder**: No Python files changed or no behavioral regressions detected.";
            }

            // Find existing bot comment and update it (avoid comment spam on re-runs)
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('LLM-Diff-BugFinder')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

      # ── 7. Fail the CI check if regressions were found ───────────────────
      #   Comment this out if you want the check to be advisory-only (not blocking)
      - name: Fail if regressions found
        if: steps.scanner.outcome == 'failure'
        run: |
          echo "❌ LLM-Diff-BugFinder found behavioral regressions. See PR comment for details."
          exit 1
